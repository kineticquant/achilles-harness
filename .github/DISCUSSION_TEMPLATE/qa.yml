title: "❓ Question: [Brief summary]"
labels:
  - help
body:
  - type: markdown
    attributes:
      value: |
        💡 Before posting, please attach your **diagnostics JSON** — it helps debug faster.  
        [How to capture diagnostics](https://github.com/kineticquant/achilles-harness/blob/main/docs/troubleshooting.html#diagnostics)
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the issue in detail and attach your diagnostics JSON if possible.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us how to reproduce the issue — commands, steps, or context.
  - type: textarea
    id: version
    attributes:
      label: Achilles version and environment
      description: Include your Achilles version and operating system if known.
